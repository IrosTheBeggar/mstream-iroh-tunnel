[package]
name = "mstream-iroh-tunnel"
version = "0.2.1"
edition = "2021"
description = "mStream remote-access tunnel client: dials a server's iroh endpoint from a Quick Connect pairing code or a federation guest ticket and exposes it as a local HTTP origin. Rust library plus a C ABI for other languages."
license = "MIT"
repository = "https://github.com/IrosTheBeggar/mstream-iroh-tunnel"
homepage = "https://mstream.io/"
readme = "README.md"
keywords = ["mstream", "iroh", "tunnel", "quic", "p2p"]
categories = ["network-programming"]

[lib]
# The library keeps its historical name so the shipped artifacts (libiroh_tunnel.so,
# iroh_tunnel.xcframework, iroh_tunnel.dll) and the C symbols (mstream_iroh_*) do not
# change for the consumers that load them by name.
name = "iroh_tunnel"
# cdylib → the per-platform binaries (Android .so, Apple xcframeworks, Windows .dll);
# rlib → Rust consumers (mstream-terminal-player), the dev bin and the tests.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "iroh-tunnel-client"
path = "src/bin/client.rs"
required-features = ["c-abi"]

[features]
default = ["c-abi"]
# The C ABI (`mstream_iroh_*`) and the owned runtime behind it — what a
# binding loads. A Rust consumer turns it off so no `#[no_mangle]` symbols
# land in its own binary.
c-abi = []
# Check the relay's TLS against the operating system's trust store as well as
# the compiled-in roots: a corporate network that inspects TLS re-signs the
# relay with a CA only the system store knows.
os-trust = ["iroh/platform-verifier"]

[dependencies]
# Cargo.lock holds libc at 0.2.189 (`cargo update -p libc --precise 0.2.189`):
# 0.2.190 gates `in6_ifreq` to macOS, and netdev (iroh's interface watcher, via
# netwatch) still names it on iOS, so the iOS xcframework stops compiling on
# anything newer. The fix is upstream as shellrow/netdev#192 (defines the struct
# locally; open as of 2026-10-30): lift the hold once a netdev release carrying
# it is in the tree.
# iroh CORE only — no iroh-blobs/docs/gossip/rpc (keeps the Android .so small).
iroh = "1"
iroh-tickets = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
# Random 128-bit loopback token that authenticates the localhost hop, so other
# apps on the device can't use the tunnel as an open proxy. 0.2 is already in tree.
getrandom = "0.2"

# Android only: register the JavaVM + app Context with ndk_context (iroh's
# network monitoring needs it). jni stays on 0.21, the line netdev (iroh's
# interface watcher) is on; iroh's resolver and TLS crates are on 0.22, so the
# Android .so carries both until netdev moves.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# Size-optimized release (Android). Host/dev builds use the default debug profile.
[profile.release]
opt-level = "z"
lto = "thin"
strip = true
codegen-units = 1
