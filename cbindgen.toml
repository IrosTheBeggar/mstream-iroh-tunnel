# The C header for the `mstream_iroh_*` ABI (src/c_api.rs), generated by
# cbindgen: `cbindgen --config cbindgen.toml --crate mstream-iroh-tunnel
# --output include/mstream_iroh.h`. The committed header is checked against a
# fresh generation in CI, so it cannot drift from the source.
language = "C"
include_guard = "MSTREAM_IROH_H"
include_version = true
cpp_compat = true
documentation = true
documentation_style = "doxy"
header = "/* mstream-iroh-tunnel — the C ABI of the mStream tunnel client. See README.md. */"

[export]
include = []

[fn]
prefix = ""

[parse]
parse_deps = false
# cbindgen warns that it has no define for `feature = "c-abi"`; the C ABI
# module is what the header is for, so its items are emitted unguarded.
